version: 1
project: TESE-MARKET
repository: tinomupezeni/TESE-MARKET
stack: [fastapi, react, vite, postgres, redis, nginx, traefik]
commands:
  unit_tests: "pnpm test:unit"
  integration_tests: "pnpm test:api"
  contract_tests: "pnpm test:api"
  lint: "pnpm lint:python"
  typecheck: ""
  migration_preflight: ""
  migration_check: ""
  staging_smoke: "pnpm test:smoke"
deployment:
  topology: multi-service-bff
  artifact_identity: image-digest
  staging_compose: "docker-compose.vps.yml"
  production_compose: "docker-compose.prod.yml"
known_baseline_failures: []
notes: "Commands verified from package.json. Smoke and deployment commands require the project's environment and must not be run against production without approval."
